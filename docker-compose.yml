services:
  postgres:
    image: postgres:16-alpine
    container_name: audit-log-postgres
    environment:
      POSTGRES_DB: audit_log
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d audit_log"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: audit-log-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/audit_log
      SPRING_DATASOURCE_USERNAME: audit_user
      SPRING_DATASOURCE_PASSWORD: audit_pass
    ports:
      - "8080:8080"

volumes:
  postgres_data:
