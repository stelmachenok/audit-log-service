services:
  postgres:
    image: postgres:16-alpine
    container_name: audit-log-postgres-dev
    environment:
      POSTGRES_DB: audit_log
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d audit_log"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
