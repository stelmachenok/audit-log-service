spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/audit_log
    username: audit_user
    password: audit_pass
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
